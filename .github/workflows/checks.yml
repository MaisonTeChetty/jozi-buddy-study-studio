name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Python 3.12 / Node 24
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Check Python dependencies
        run: python -m pip check
      - name: Run security, privacy, and study tests
        run: python -m pytest -q
      - name: Install frontend dependencies
        run: npm.cmd --prefix web ci
      - name: Test frontend behavior
        run: npm.cmd --prefix web test
      - name: Build and check microphone assets
        run: npm.cmd --prefix web run build
      - name: Audit frontend dependencies
        run: npm.cmd --prefix web audit --audit-level=high
